<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign to Technician</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 40%;
            background: white;
            padding: 30px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0d47a1;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0d47a1;
            box-shadow: 0px 0px 8px rgba(13, 71, 161, 0.3);
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            width: 48%;
            transition: 0.3s;
        }
        .submit-btn {
            background: #0d47a1;
            color: white;
            font-weight: bold;
        }
        .submit-btn:hover {
            background: #0a3570;
        }
        .cancel-btn {
            background: white;
            border: 2px solid #0d47a1;
            color: #0d47a1;
            font-weight: bold;
        }
        .cancel-btn:hover {
            background: #0d47a1;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Assign to Technician</h2>
        <form id="assignForm">
            <div class="form-group">
                <label for="machine">Machine Name</label>
                <input type="text" id="machine" placeholder="Enter Machine Name" required>
            </div>
            <div class="form-group">
                <label for="technician">Assign To</label>
                <select id="technician" required>
                    <option value="">Select Technician</option>
                    <option value="tech1">Technician 1</option>
                    <option value="tech2">Technician 2</option>
                    <option value="tech3">Technician 3</option>
                    <option value="tech4">Technician 4</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Notes to Technician</label>
                <textarea id="notes" rows="4" placeholder="Enter notes here..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Image</label>
                <input type="file">
            </div>
            <div class="buttons">
                <button type="submit" class="btn submit-btn">Submit</button>
                <button type="button" class="btn cancel-btn" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("assignForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Form submitted successfully!");
            this.reset();
        });
        
        function resetForm() {
            document.getElementById("assignForm").reset();
        }
    </script>
</body>
</html>
