<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    color: #000000;
  }

 
  .navbar {
    background-color: #000000;
    color: #ffffff;
    display: flex;
    align-items: center;
    padding: 16px; 
    text-align: center;
  
  }
  .navbar .title h1{
    font-size: 20px; 
    margin-left:12px;

  }
  .navbar .menuicon {
    font-size: 30px; 
    cursor: pointer;
  }

 
  .container {
    max-width: 1200px;
    margin: 16px auto; 
    padding: 0 16px; 
  }
  .container h1 {
    margin-bottom: 24px; 
    font-size: 24px; 
  }

  
  .Statustile {
    display: flex;
    gap: 16px; 
    margin-bottom: 32px; 
  }
  .card {
    flex: 1;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    padding: 16px; 
    height: 120px;
    
  }
  .status {
    font-size: 16px; 
    margin-bottom: 16px; 
    color: #000000;
  
  }
  .status h1{
    font-size: 36px; 
    margin-bottom: 8px; 
    color: #000000;
    margin-left: 16px;
  
  }
  .card-number {
    font-size: 32px; 
    font-weight: bold;
    color: #333;
  }

  .workingfine {
    color: #28a745; 
  }
  .workingfine h1{
    font-size: 28px;
  }
  .inwarning {
    color: #ffc107; 
  }
  .inwarning h1{
    font-size: 28px;
  }
  .underfault {
    color: #dc3545; 
  }

  .underfault h1{
    font-size: 28px;
  }
 
  .listofmachines {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px; 
  }
  .listofmachines h2 {
    font-size: 19px; 
  }
  .generatebutton {
    background-color: #000000;
    color: #fff;
    border: none;
    padding: 8px 16px; 
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px; 
  }
 
  table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
  }
  thead {
    background-color: #f1f1f1;
  }
  th,
  td {
    text-align: left;
    padding: 12px 16px; 
  }
  th {
    font-weight: 600;
    color: #fff;
    background-color: #000000;
  }
  tr:not(:last-child) {
    border-bottom: 1px solid #ddd;
  }

  
  .ok {
    color: #28a745; 
  }
  .warning {
    color: #ffc107; 
  }
  .fault {
    color: #dc3545; 
  }


  .viewbutton {
    background-color: #000000;
    color: #fff;
    border: none;
    padding: 6px 13px; 
    border-radius: 24px;
    cursor: pointer;
    font-size: 13px; 
  }
  .viewbutton:hover {
    background-color: #5a6268;
  }
</style>
<body>

 <!---------Navigation Bar---------->

  <nav class="navbar">
    <div class="menuicon">&#9776;</div>
    <div class="title"><h1>Dashboard</h1></div>
    
  </nav>


  <!---------Container---------->
  <div class="container">
    <h1>Hey Manager!</h1>

  
     <!---------Status Tiles---------->
    <div class="Statustile">
      <!-- Machine that are OK-->
      <div class="card">
        <div class="status">Ok</div>
        <div class="workingfine">
          <h1>03</h1></div>
      </div>

      <!-- Machines under warning-->
      <div class="card">
        <div class="status">Warning</div>
        <div class="inwarning"><h1>02</h1></div>
      </div>
      <!--Machines under fault-->
      <div class="card">
        <div class="status">Fault</div>
        <div class="underfault"><h1>06</h1></div>
      </div>
    </div>

    <!--------List of machines---------->
    <div class="listofmachines">
      <h2>List of Machines</h2>
      <button class="generatebutton">Generate Report</button>
    </div>

  <!---------Table for list of machines-------->
    <table>
      <thead>
        <tr>
          <th>Machine Code</th>
          <th>Machine Name</th>
          <th>Status</th>
          <th>Update</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#3454</td>
          <td>Lathe</td>
          <td class="warning">Warning</td>
          <td>Under Repair</td>
          <td><button class="viewbutton">View</button></td>
        </tr>
        <tr>
          <td>#3453</td>
          <td>Lathe</td>
          <td class="ok">OK</td>
          <td>Working Fine</td>
          <td><button class="viewbutton">View</button></td>
        </tr>
        <tr>
          <td>#3452</td>
          <td>Lathe</td>
          <td class="warning">Warning</td>
          <td>Under Repair</td>
          <td><button class="viewbutton">View</button></td>
        </tr>
        <tr>
          <td>#3451</td>
          <td>Lathe</td>
          <td class="ok">OK</td>
          <td>Working Fine</td>
          <td><button class="viewbutton">View</button></td>
        </tr>
        <tr>
          <td>#3450</td>
          <td>Lathe</td>
          <td class="warning">Warning</td>
          <td>Under Repair</td>
          <td><button class="viewbutton">View</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
