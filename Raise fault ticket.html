<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise a Fault Ticket</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 40%;
            background: white;
            padding: 30px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #d32f2f;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #d32f2f;
            box-shadow: 0px 0px 8px rgba(211, 47, 47, 0.3);
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            width: 48%;
            transition: 0.3s;
        }
        .submit-btn {
            background: #d32f2f;
            color: white;
            font-weight: bold;
        }
        .submit-btn:hover {
            background: #a50f0f;
        }
        .cancel-btn {
            background: white;
            border: 2px solid #d32f2f;
            color: #d32f2f;
            font-weight: bold;
        }
        .cancel-btn:hover {
            background: #d32f2f;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Raise a Fault Ticket</h2>
        <form id="faultForm">
            <div class="form-group">
                <label for="machine">Machine Name</label>
                <input type="text" id="machine" placeholder="Enter Machine Name" required>
            </div>
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="Enter Issue Title" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" placeholder="Describe the issue..." required></textarea>
            </div>
            <div class="form-group">
                <label>Upload Image</label>
                <input type="file">
            </div>
            <div class="buttons">
                <button type="submit" class="btn submit-btn">Submit</button>
                <button type="button" class="btn cancel-btn" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("faultForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Fault Ticket Submitted Successfully!");
            this.reset();
        });
        
        function resetForm() {
            document.getElementById("faultForm").reset();
        }
    </script>
</body>
</html>
