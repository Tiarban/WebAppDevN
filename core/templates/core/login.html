{# templates/login.html #}
{% extends 'core/base.html' %}
{% load static %}
{% block title %}Login | Utensia{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/login.css' %}">{% endblock %}
{% block content %}

<div class="login-container">
  <div class="login-box">
    <div class="logo">
      <img src="{% static 'Logo/Utensia.png' %}" alt="Utensia Logo">
    </div>
    <h2>Login</h2>
    <form id="loginForm" method="post">
      {% csrf_token %}
      <div class="textbox">
        <input type="email" id="email" name="email" placeholder="Email" required>
      </div>
      <div class="textbox">
        <input type="password" id="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      
      <div class="guest-option">
        <a href="{% url 'homepage' %}">Continue as Guest</a>
      </div>
      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById('loginForm').addEventListener('submit', function(event) {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
      event.preventDefault();
      alert('Please fill in all fields');
      return false;
    }
    

    if (email === 'manager@utensia.com' && password === 'password') {
      event.preventDefault();
      window.location.href = "{% url 'manager' %}";
    } else if (email === 'tech@utensia.com' && password === 'password') {
      event.preventDefault();
      window.location.href = "{% url 'technician' %}";
    }
    
    return true;
  });
</script>
{% endblock %}
